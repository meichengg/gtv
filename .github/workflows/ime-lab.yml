# IME Lab: kiểm thử gõ thật trên máy ảo macOS của GitHub (dùng một lần) — không đụng máy người dùng.
# Build GTV (Debug, có log), cài GTV cùng các terminal, gõ phím giả qua HID (đi qua bộ gõ như bàn phím thật),
# ghi byte shell nhận được, đọc dòng lệnh fish, chụp màn hình. Xem tools/lab/run.py.
name: IME Lab

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Terminal (terminal ghostty rex muxy herdr kitty wezterm iterm2)"
        default: "terminal ghostty rex muxy herdr kitty wezterm iterm2"
        type: string
      methods:
        description: "Kiểu gõ (vni telex)"
        default: "vni telex"
        type: string
      styles:
        description: "Cách gõ trong terminal (marked inline inlineBare direct)"
        default: "marked inline deferred direct"
        type: string
  push:
    branches: ['lab/**']

permissions:
  contents: read

concurrency:
  group: ime-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    # tools/lab/lab.env có thể chọn loại máy (RUNNER=…), vd. máy Intel khi máy macOS arm64 của GitHub đang thiếu.
    name: Config
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.r.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: r
        run: |
          r="$(grep -E '^RUNNER=' tools/lab/lab.env 2>/dev/null | tail -1 | cut -d= -f2-)"
          echo "runner=${r:-macos-26}" >> "$GITHUB_OUTPUT"

  lab:
    name: Lab
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 110
    env:
      TERMS: ${{ inputs.terms || 'terminal ghostty rex muxy herdr kitty wezterm iterm2' }}
      METHODS: ${{ inputs.methods || 'vni telex' }}
      STYLES: ${{ inputs.styles || 'marked inline deferred direct' }}
      OUT: ${{ github.workspace }}/lab-out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lab config (tools/lab/lab.env ghi đè TERMS/METHODS/STYLES/MODE)
        run: |
          echo "MODE=full" >> "$GITHUB_ENV"
          if [ -f tools/lab/lab.env ]; then grep -E '^(TERMS|METHODS|STYLES|MODE)=' tools/lab/lab.env >> "$GITHUB_ENV"; cat tools/lab/lab.env; fi

      - name: Select latest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$latest" ] && sudo xcode-select -s "$latest"
          xcodebuild -version
          sw_vers

      - name: Install tools and terminals
        run: |
          brew install xcodegen fish >/dev/null
          # Lượt chỉ thử ứng dụng thường (TERMS rỗng trong lab.env): không cần cài terminal.
          if [ -z "${TERMS// }" ]; then echo "TERMS rỗng: bỏ qua cài terminal"; exit 0; fi
          for c in iterm2 kitty wezterm; do brew install --cask "$c" >/dev/null || echo "::warning::không cài được $c"; done
          # Ghostty đúng bản người dùng đang dùng (1.4.0; cask có thể cũ hơn, khác hành vi insertText)
          m="$(mktemp -d)"; curl -sfL https://release.files.ghostty.org/1.4.0/Ghostty.dmg -o "$RUNNER_TEMP/ghostty.dmg"
          hdiutil attach -nobrowse -quiet -mountpoint "$m" "$RUNNER_TEMP/ghostty.dmg" && cp -R "$m/Ghostty.app" /Applications/ && hdiutil detach -quiet "$m"
          defaults read /Applications/Ghostty.app/Contents/Info.plist CFBundleShortVersionString
          # Rex (libghostty, mã nguồn đóng): bản mới nhất từ feed Sparkle
          url="$(curl -sfL https://blob.superlogical.com/public/rex-app/preview-arm64/appcast.xml | grep -o 'url="[^"]*"' | head -1 | cut -d'"' -f2)" || true
          if [ -n "$url" ]; then
            f="$RUNNER_TEMP/rex.${url##*.}"; curl -sfL "$url" -o "$f" || true
            case "$f" in
              *.dmg) m="$(mktemp -d)"; hdiutil attach -nobrowse -quiet -mountpoint "$m" "$f" && cp -R "$m"/*.app /Applications/ && hdiutil detach -quiet "$m" ;;
              *.zip) ditto -x -k "$f" /Applications/ ;;
            esac
          fi
          # Muxy 2.3.0 (libghostty-vt, lớp nhập liệu riêng)
          curl -sfL https://github.com/muxy-app/muxy/releases/download/v2.3.0/Muxy-2.3.0-arm64.dmg -o "$RUNNER_TEMP/muxy.dmg" && {
            m="$(mktemp -d)"; hdiutil attach -nobrowse -quiet -mountpoint "$m" "$RUNNER_TEMP/muxy.dmg" && cp -R "$m"/*.app /Applications/ && hdiutil detach -quiet "$m"; } || true
          # Herdr (GPUI + libghostty-vt) và herdr-core (chạy các terminal; cài sẵn để app mở thẳng cửa sổ chính)
          brew install --cask herdr-app >/dev/null || echo "::warning::không cài được Herdr"
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh >/dev/null 2>&1 || echo "::warning::không cài được herdr-core"
          # Bỏ cờ quarantine để lần mở đầu không bị Gatekeeper hỏi (hộp thoại chặn cả lab)
          for a in /Applications/iTerm.app /Applications/Ghostty.app /Applications/kitty.app /Applications/WezTerm.app "/Applications/Rex Beta.app" /Applications/Muxy.app /Applications/Herdr.app; do
            [ -d "$a" ] && xattr -dr com.apple.quarantine "$a" 2>/dev/null || true
          done
          ls -d /Applications/*.app | grep -iE "ghostty|iterm|kitty|wezterm|rex|muxy|herdr" || true
          ls -la ~/.local/share/herdr-core ~/.local/bin 2>/dev/null | head -20 || true
          # kitty / WezTerm không mở cửa sổ trên máy ảo: ghi log khởi động để biết vì sao
          mkdir -p "$OUT"
          (/Applications/kitty.app/Contents/MacOS/kitty --debug-rendering -o allow_remote_control=no -e /usr/bin/true > "$OUT/kitty-launch.log" 2>&1 &)
          (WEZTERM_LOG=info /Applications/WezTerm.app/Contents/MacOS/wezterm-gui start --always-new-process -- /usr/bin/true > "$OUT/wezterm-launch.log" 2>&1 &)
          sleep 10; screencapture -x "$OUT/launch-diag.png" || true
          pkill -f kitty.app/Contents/MacOS || true; pkill -f WezTerm.app/Contents/MacOS || true

      - name: Build GTV (Debug)
        run: |
          xcodegen
          set -o pipefail
          xcodebuild -project GTV.xcodeproj -scheme GTV -configuration Debug -derivedDataPath build/dd build \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Package GTV.app (Debug, có log) để cài thử
        run: ditto -c -k --sequesterRsrc --keepParent build/dd/Build/Products/Debug/GTV.app "$RUNNER_TEMP/GTV-debug.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gtv-debug-app-${{ github.run_number }}
          path: ${{ runner.temp }}/GTV-debug.zip
          retention-days: 7

      # Bản Release cùng commit (không có log chẩn đoán) để cài lên máy thật sau khi lab qua.
      - name: Build + package GTV.app (Release)
        run: |
          set -o pipefail
          xcodebuild -project GTV.xcodeproj -scheme GTV -configuration Release -derivedDataPath build/dd-release build \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          ditto -c -k --sequesterRsrc --keepParent build/dd-release/Build/Products/Release/GTV.app "$RUNNER_TEMP/GTV-release.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gtv-release-app-${{ github.run_number }}
          path: ${{ runner.temp }}/GTV-release.zip
          retention-days: 14

      # Thử cấp quyền Trợ năng / gửi phím cho bộ gõ (cần cho cách gõ bằng phím ⌫ giả ở Java, Qt 5, GTK…). GTVInput ghi kết
      # quả vào log lúc khởi động ("quyền gửi phím=…").
      - name: Grant accessibility to GTVInput (thử)
        continue-on-error: true
        run: |
          csrutil status || true
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for svc in kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) VALUES ('$svc', 'com.gtv.inputmethod.GTV', 0, 2, 4, 1, NULL, 0, CAST(strftime('%s','now') AS INTEGER));" \
                && echo "ok: $svc → $db" || echo "::warning::không ghi được $svc vào $db"
            done
          done
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "SELECT service, client, auth_value FROM access WHERE client LIKE '%gtv%';" || true

      - name: Install GTV
        run: |
          mkdir -p /tmp/l "$OUT/shots"
          swiftc -O -o /tmp/l/is tools/lab/is.swift
          swiftc -O -o /tmp/l/drv tools/lab/driver.swift
          defaults write com.gtv.inputmethod.GTV method -int 1
          cp -R build/dd/Build/Products/Debug/GTV.app /Applications/
          open /Applications/GTV.app
          # macOS hỏi "Allow GTV to enable GTV?" (System Settings); Allow là nút mặc định -> Return.
          for i in 1 2 3 4 5 6; do
            sleep 3
            if /tmp/l/is list | grep -q "com.gtv.inputmethod.GTV.vi enabled=true"; then break; fi
            screencapture -x "$OUT/shots/00-enable-prompt-$i.png"
            /tmp/l/drv - 10 "{RET}" || true
          done
          for i in $(seq 1 30); do pgrep -x GTV >/dev/null || break; sleep 0.5; done   # đợi GTV.app (launcher) xong
          # Bộ gõ cha cũng phải bật (macOS lại hỏi Allow)
          for i in 1 2 3 4 5; do
            /tmp/l/is list | grep -q "com.gtv.inputmethod.GTV enabled=true" && break
            /tmp/l/is enable com.gtv.inputmethod.GTV || true
            sleep 3; screencapture -x "$OUT/shots/00-enable-parent-$i.png"
            /tmp/l/drv - 10 "{RET}" || true
          done
          /tmp/l/is select com.gtv.inputmethod.GTV.vi || true
          pkill -x "System Settings" || true
          sleep 1
          screencapture -x "$OUT/shots/00-after-install.png"
          /tmp/l/is list
          echo "current: $(/tmp/l/is get)"
          DRIVER_VERBOSE=1 /tmp/l/drv - 10 "" || true
          /tmp/l/is list | grep -q "com.gtv.inputmethod.GTV.vi enabled=true" || { echo "::error::GTV chưa được bật"; exit 1; }

      - name: Run lab
        if: env.MODE == 'full'
        run: python3 tools/lab/run.py

      # Sau cùng: bước dò đổi input source từ tiến trình khác (TISSelectInputSource), làm Terminal.app có lúc thôi gửi
      # phím cho bộ gõ (lab 41871623817, 41895710423) — không để ảnh hưởng tới các bài ở trên.
      - name: Probe (phím giả có đi qua bộ gõ không)
        if: always()
        run: python3 tools/lab/probe.py

      - name: Diagnose IME restart
        # Cập nhật GTV tắt rồi mở lại bộ gõ: kiểm tra input source có còn chọn được không.
        if: always()
        run: |
          echo "trước: $(/tmp/l/is get)"; /tmp/l/is list | grep gtv || true
          pkill -x GTVInput || true; sleep 1
          open -g "$HOME/Library/Input Methods/GTVInput.app"; sleep 4
          echo "sau khi tắt/mở lại:"; /tmp/l/is list | grep gtv || true
          /tmp/l/is select com.gtv.inputmethod.GTV.vi || true

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$OUT"
          cp ~/Library/Logs/GTV-debug.log "$OUT/" 2>/dev/null || true
          defaults read com.gtv.inputmethod.GTV > "$OUT/gtv-defaults.txt" 2>&1 || true
          screencapture -x "$OUT/shots/99-end.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-lab-${{ github.run_number }}
          path: lab-out
