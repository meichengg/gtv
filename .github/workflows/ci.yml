# RUn test for all PRs
name: CI

on:
  pull_request:
  workflow_dispatch:

# Chỉ đọc mã nguồn; token không nằm lại trong .git/config (persist-credentials: false).
permissions:
  contents: read

concurrency:
  # Cancel last run when have new commit to PR
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select latest stable Xcode
        run: |
          # Xcode mới nhất không phải bản thử (beta / RC): tên thư mục trên máy của GitHub không phải lúc nào cũng có chữ
          # beta, nên xem thêm loại giấy phép của Xcode.
          pick=""
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V); do
            case "$(printf '%s' "$x" | tr 'A-Z' 'a-z')" in *beta*|*release_candidate*|*_rc*) continue ;; esac
            license="$(/usr/libexec/PlistBuddy -c 'Print :licenseType' "$x/Contents/Resources/LicenseInfo.plist" 2>/dev/null || true)"
            [ "$license" = "Beta" ] && continue
            pick="$x"
          done
          [ -n "$pick" ] && sudo xcode-select -s "$pick"
          xcodebuild -version

      - name: Generate Xcode project from project.yml
        run: |
          brew install xcodegen
          xcodegen

      - name: Check CHANGELOG.md
        run: |
          version="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)"
          if scripts/release_notes.sh "$version" > /dev/null; then
            echo "CHANGELOG.md has a section for $version."
          else
            echo "::warning file=CHANGELOG.md::No '## $version' section in CHANGELOG.md. The Release workflow will stop on main without release notes."
          fi

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project GTV.xcodeproj -scheme GTV -derivedDataPath build/dd test \
            | grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"
